    <script>
    // ============================================
    // FUNCIÓN PARA OBTENER IMÁGENES (Base64 o física)
    // ============================================
    
    function obtenerImagenEspecialidadLocal(especialidad) {
    // ✅ PRIORIDAD 1: Imagen en Base64 guardada en el registro
    // Esto incluye imágenes nuevas Y actualizadas
    if (especialidad.img_base64) {
        console.log('✅ Usando img_base64 guardado para:', especialidad.nombre);
        return especialidad.img_base64;
    }
    
    // ✅ PRIORIDAD 2: Buscar en IMAGENES_BASE64 global SOLO si NO tiene img_base64
    if (especialidad.img && window.IMAGENES_BASE64 && window.IMAGENES_BASE64[especialidad.img]) {
        console.log('✅ Usando IMAGENES_BASE64 para:', especialidad.img);
        return window.IMAGENES_BASE64[especialidad.img];
    }
    
    // ✅ PRIORIDAD 3: Usar la función global de main.js si existe
    if (especialidad.img && typeof obtenerImagen === 'function') {
        console.log('✅ Usando función obtenerImagen() para:', especialidad.img);
        return obtenerImagen(especialidad.img, 'assets/img');
    }
    
    // ✅ PRIORIDAD 4: Ruta física directa
    if (especialidad.img) {
        console.log('⚠️ Usando ruta física para:', especialidad.img);
        return `assets/img/${especialidad.img}`;
    }
    
    // ✅ FALLBACK: Imagen por defecto
    console.log('⚠️ Usando imagen por defecto para:', especialidad.nombre);
    return 'assets/img/default-especialidad.jpg';
    }

    // ============================================
    // DESPLEGAR ESPECIALIDADES - VERSIÓN CORREGIDA
    // ============================================
    
    function desplegarEspecialidades() {
        console.log('🔄 Cargando especialidades...');
        
        let listaEspecialidades = document.getElementById('especialidades');
        let titulo = document.getElementById('titulo');    
        let divVolver = document.getElementById('divVolver');    

        divVolver.innerHTML = "";
        listaEspecialidades.innerHTML = "";

        titulo.innerHTML = `
            <div class="col-12 text-center mb-5">
                <h3>Especialidades</h3>
                <hr>
                <p>Un equipo de profesionales especializados en diversas áreas de la salud</p>
            </div>
        `;

        datosEspecialidades.forEach((especialidad, index) => {
            console.log(`📋 Especialidad ${index + 1}:`, {
                nombre: especialidad.nombre,
                tieneImgBase64: !!especialidad.img_base64,
                img: especialidad.img
            });
            
            const fila = document.createElement('div');
            fila.classList.add('col-sm-12', 'mt-3', 'col-md-3');
            
            // ✅ OBTENER IMAGEN USANDO LA FUNCIÓN HELPER
            const imagenSrc = obtenerImagenEspecialidadLocal(especialidad);
            
            fila.innerHTML = `
                <div class="card h-100">
                    <img src="${imagenSrc}" 
                         class="card-img-top" 
                         alt="Especialidad ${especialidad.nombre}"
                         style="height: 200px; width: 100%; object-fit: cover; object-position: center;"
                         onerror="console.error('❌ Error cargando imagen para ${especialidad.nombre}'); this.src='assets/img/default-especialidad.jpg'">
                    <div class="card-body text-center text-sm-start">
                        <h5 class="card-title">${especialidad.nombre}</h5>
                        <p class="card-text">${especialidad.descripcion || 'Descripción no disponible'}</p>
                        <a href="javascript:desplegarProfesionalesEspecialidad(${especialidad.id_especialidad})" class="btn btn-primary">Ver profesionales</a>
                    </div>
                </div>
            `;

            listaEspecialidades.appendChild(fila);
        });
        
        console.log('✅ Especialidades cargadas:', datosEspecialidades.length);
    }

    // ============================================
    // INICIALIZACIÓN
    // ============================================
    
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Página especialidades.html cargada');
        
        // Verificar que las imágenes Base64 estén disponibles
        if (window.IMAGENES_BASE64) {
            console.log('✅ IMAGENES_BASE64 disponibles:', Object.keys(window.IMAGENES_BASE64).length);
        } else {
            console.warn('⚠️ IMAGENES_BASE64 no está disponible');
        }
        
        // Actualizar UI del menú (mostrar Admin y Cerrar Sesión si está logueado)
        if (typeof checkAuthenticationAndUI === 'function') {
            checkAuthenticationAndUI();
            console.log('✅ Menú actualizado');
        } else {
            console.warn('⚠️ checkAuthenticationAndUI no disponible');
        }
        
        // Cargar especialidades
        desplegarEspecialidades();
    });
